name: Oracle source review
on:
  push:
    branches: ['review/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source packages
        run: |
          test -f Oracle_Exact_Source_Import_20261121/packages/owner-gate/src/owner_gate_core.mjs
          test -f Oracle_Exact_Source_Import_20261121/packages/owner-gate/tests/test_owner_gate_flow.mjs
          test -f Oracle_Exact_Source_Import_20261121/packages/oracle-worker/patch/model_capability.py
          test -f Oracle_Exact_Source_Import_20261121/packages/oracle-worker/tests/test_model_capability.py
      - name: Test owner gate
        working-directory: Oracle_Exact_Source_Import_20261121/packages/owner-gate
        run: |
          node --test tests/test_owner_gate_flow.mjs tests/test_portal_ui.mjs
          python -m pip install pytest
          python -m pytest -q tests/test_contract_files.py
      - name: Test Oracle worker
        working-directory: Oracle_Exact_Source_Import_20261121/packages/oracle-worker
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test independent release evidence (stage only)
        working-directory: Oracle_Exact_Source_Import_20261121/packages/owner-gate/release-evidence-v1
        run: |
          node --test test_release_approval_v1.mjs test_signer_bootstrap.mjs test_release_gate.mjs test_release_owner_panel.mjs test_first_reviewer.mjs test_guided_first_key.mjs test_prepare_release_review.mjs
      - name: Test phone notification transport
        working-directory: Oracle_Exact_Source_Import_20261121/packages/owner-gate/phone-alert-v1
        run: node --test test_notification_core.mjs test_service_worker.mjs
      - name: Test signed public confirmation transfer
        working-directory: Oracle_Exact_Source_Import_20261121/packages/owner-gate/proof-transfer-v1
        run: node --test test_proof_transfer.mjs


  release-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: release_gate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the exact production database driver for boundary regression
        working-directory: Oracle_Exact_Source_Import_20261121/packages/owner-gate/proof-transfer-v1
        run: npm install --no-save --ignore-scripts --no-package-lock postgres@3.4.5
      - name: Verify private release ledger atomicity (synthetic only)
        working-directory: Oracle_Exact_Source_Import_20261121/packages/owner-gate/release-evidence-v1
        env:
          BATCAVE_TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@localhost:5432/release_gate_test
        run: |
          python3 test_release_ledger.py
          python3 test_first_ledger.py
          python3 ../phone-alert-v1/test_notification_ledger.py
          python3 ../proof-transfer-v1/test_proof_ledger.py
          python3 test_lab_grant_lease.py
