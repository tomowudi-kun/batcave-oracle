name: Oracle source review
on:
  push:
    branches: ['review/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run owner gate tests if imported
        shell: bash
        run: |
          set -euo pipefail
          if [ -d packages/owner-gate/tests ]; then
            cd packages/owner-gate
            node --test tests/test_owner_gate_flow.mjs tests/test_portal_ui.mjs
            python -m pip install pytest
            python -m pytest -q tests/test_contract_files.py
          else
            echo 'Owner gate source not yet imported; NOT a lab pass'
          fi
      - name: Run worker tests if imported
        shell: bash
        run: |
          set -euo pipefail
          if [ -d packages/oracle-worker/tests ]; then
            cd packages/oracle-worker
            python -m pip install pytest
            python -m pytest -q tests
          else
            echo 'Worker source not yet imported; NOT a lab pass'
          fi
