<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle recovery diagnostic (read-only)</title><style>body{font:16px system-ui;max-width:680px;margin:2rem auto;padding:1rem}button,input{padding:.7rem;margin:.3rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Oracle recovery diagnostic</h1><p>Read-only. No signing, enrollment, key export, or database changes.</p><button id="inspect">Inspect local browser key storage</button><pre id="out"></pre><script>'use strict';const out=document.getElementById('out');function show(x){out.textContent=JSON.stringify(x,null,2)}document.getElementById('inspect').onclick=async()=>{try{const names=await indexedDB.databases();const matches=names.filter(x=>/^batcave_linux_signer_v1$/.test(x.name));if(!matches.length)return show({status:'NO_LOCAL_DATABASE',origin:location.origin,availableDatabaseNames:names.map(x=>x.name).filter(x=>x&&x.startsWith('batcave'))});const result=await new Promise((resolve,reject)=>{const req=indexedDB.open('batcave_linux_signer_v1');req.onerror=()=>reject(req.error);req.onsuccess=()=>{const db=req.result;const stores=[...db.objectStoreNames];const summary={status:'DATABASE_FOUND',origin:location.origin,version:db.version,stores};if(!stores.includes('keys')){db.close();return resolve(summary)}const tx=db.transaction('keys','readonly'),get=tx.objectStore('keys').getAll();get.onsuccess=()=>{summary.records=get.result.map(v=>({fields:Object.keys(v||{}),keyFields:Object.entries(v||{}).filter(([k,x])=>x&&typeof x==='object'&&x.constructor?.name==='CryptoKey').map(([k,x])=>({field:k,type:x.type,extractable:x.extractable,algorithm:x.algorithm?.name}))}));db.close();resolve(summary)};get.onerror=()=>{db.close();reject(get.error)}}});show(result)}catch(e){show({status:'ERROR',message:String(e.message||e)})}};</script></html>
